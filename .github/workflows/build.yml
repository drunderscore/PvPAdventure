name: Build Mod

on:
  push:
    branches:
      - erkys-features
      - feature/missinginmaster
  pull_request:
    branches:
      - main

env:
  TML_VERSION: v2026.03.3.0

jobs:
  build-mod:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout PvPAdventure
        uses: actions/checkout@v6
        with:
          path: PvPAdventure

      - name: Checkout PvPFramework
        uses: actions/checkout@v6
        with:
          repository: emyhrberg/PvPFramework
          ref: b68fb534b25c26bdce4b287fa4efdf9101b592af
          token: ${{ secrets.PVPFRAMEWORK_READ_TOKEN }}
          path: PvPFramework

      - name: Checkout PvPHub
        uses: actions/checkout@v6
        with:
          repository: emyhrberg/PvPHub
          ref: 98025b8163e8905e51154d2b23badc6e6f1d8b58
          token: ${{ secrets.PVPHUB_READ_TOKEN }}
          path: PvPHub

      - name: Verify dependency revisions
        shell: pwsh
        run: |
          Write-Host "PvPAdventure:"
          git -C PvPAdventure rev-parse HEAD

          Write-Host "PvPFramework:"
          git -C PvPFramework rev-parse HEAD

          Write-Host "PvPHub:"
          git -C PvPHub rev-parse HEAD

          git -C PvPFramework grep -n "ConfigUI"
          if ($LASTEXITCODE -ne 0) {
            throw "Checked-out PvPFramework does not define ConfigUI."
          }

          git -C PvPFramework grep -n "ConfigChat"
          if ($LASTEXITCODE -ne 0) {
            throw "Checked-out PvPFramework does not define ConfigChat."
          }

      - name: Download tModLoader
        shell: pwsh
        run: |
          $url = "https://github.com/tModLoader/tModLoader/releases/download/$env:TML_VERSION/tModLoader.zip"
          curl.exe --fail --location --silent --show-error $url -o tModLoader.zip

      - name: Extract tModLoader
        shell: pwsh
        run: |
          Expand-Archive `
            -LiteralPath tModLoader.zip `
            -DestinationPath tModLoader `
            -Force

          Remove-Item -LiteralPath tModLoader.zip

          if (!(Test-Path "tModLoader\tMLMod.targets")) {
            throw "tMLMod.targets was not found after extracting tModLoader."
          }

      - name: Create tModLoader.targets
        shell: pwsh
        run: |
          @'
          <Project ToolsVersion="14.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="tModLoader\tMLMod.targets" />
          </Project>
          '@ | Set-Content `
            -LiteralPath tModLoader.targets `
            -Encoding utf8

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        working-directory: PvPAdventure
        run: dotnet restore PvPAdventure.sln -p:Configuration=Release --disable-parallel -m:1

      - name: Build solution
        working-directory: PvPAdventure
        run: >
          dotnet build
          PvPAdventure.sln
          --configuration Release
          --no-restore
          -m:1
          --verbosity normal
          "-p:ExtraBuildModFlags=-tmlsavedirectory $env:GITHUB_WORKSPACE\tModLoaderSave"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PvPAdventure-Binaries
          if-no-files-found: error
          path: |
            PvPAdventure/bin/Release/net8.0/PvPAdventure.dll
            PvPAdventure/bin/Release/net8.0/PvPAdventure.pdb
            tModLoaderSave/Mods/PvPAdventure.tmod
