name: Build Mod

on:
  push:
    branches:
      - erkys-features
  pull_request:
    branches:
      - main

env:
  TML_VERSION: v2026.03.3.0

jobs:
  build-mod:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout PvPAdventure
        uses: actions/checkout@v6
        with:
          path: PvPAdventure

      - name: Checkout PvPOnline
        uses: actions/checkout@v6
        with:
          repository: emyhrberg/PvPOnline
          ref: 5a8d984ef8b44dd0c3d7a0d7ed197cc3610a5668
          token: ${{ secrets.PVPONLINE_READ_TOKEN }}
          path: PvPOnline

      - name: Verify dependency revisions
        shell: pwsh
        run: |
          Write-Host "PvPAdventure:"
          git -C PvPAdventure rev-parse HEAD

          Write-Host "PvPOnline:"
          git -C PvPOnline rev-parse HEAD

          git -C PvPOnline grep -n "ConfigUI"
          if ($LASTEXITCODE -ne 0) {
            throw "Checked-out PvPOnline does not define ConfigUI."
          }

          git -C PvPOnline grep -n "ConfigChat"
          if ($LASTEXITCODE -ne 0) {
            throw "Checked-out PvPOnline does not define ConfigChat."
          }

      - name: Download tModLoader
        shell: pwsh
        run: |
          $url = "https://github.com/tModLoader/tModLoader/releases/download/$env:TML_VERSION/tModLoader.zip"
          curl.exe --fail --location --silent --show-error $url -o tModLoader.zip

      - name: Extract tModLoader
        shell: pwsh
        run: |
          Expand-Archive `
            -LiteralPath tModLoader.zip `
            -DestinationPath tModLoader `
            -Force

          Remove-Item -LiteralPath tModLoader.zip

          if (!(Test-Path "tModLoader\tMLMod.targets")) {
            throw "tMLMod.targets was not found after extracting tModLoader."
          }

      - name: Create tModLoader.targets
        shell: pwsh
        run: |
          @'
          <Project ToolsVersion="14.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="tModLoader\tMLMod.targets" />
          </Project>
          '@ | Set-Content `
            -LiteralPath tModLoader.targets `
            -Encoding utf8

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        working-directory: PvPAdventure
        run: dotnet restore PvPAdventure.sln

      - name: Build solution
        working-directory: PvPAdventure
        run: >
          dotnet build
          PvPAdventure.sln
          --configuration Release
          --no-restore
          --verbosity normal
          "-p:ExtraBuildModFlags=-tmlsavedirectory $env:GITHUB_WORKSPACE\tModLoaderSave"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PvPAdventure-Binaries
          if-no-files-found: error
          path: |
            PvPAdventure/bin/Release/net8.0/PvPAdventure.dll
            PvPAdventure/bin/Release/net8.0/PvPAdventure.pdb
            tModLoaderSave/Mods/PvPAdventure.tmod